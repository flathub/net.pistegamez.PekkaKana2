id: net.pistegamez.PekkaKana2
runtime: org.freedesktop.Platform
runtime-version: 25.08
sdk: org.freedesktop.Sdk
command: pekka-kana-2
finish-args:
  - --device=all # Controller support
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/lua5.4/lua-5.4.json

  - name: libzip
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://libzip.org/download/libzip-1.11.4.tar.gz
        sha256: 82e9f2f2421f9d7c2466bbc3173cd09595a88ea37db0d559a9d0a2dc60dc722e

  - name: pekkakana2
    buildsystem: simple
    build-options:
      env:
        C_INCLUDE_PATH: /app/include/SDL2:/app/include:/usr/include/SDL2:/usr/include
        CPLUS_INCLUDE_PATH: /app/include/SDL2:/app/include:/usr/include/SDL2:/usr/include
    build-commands:
      - make all
    sources:
      - type: archive
        url: https://github.com/SaturninTheAlien/pk2_greta/archive/refs/tags/1.5.0.tar.gz
        sha256: caea1325493cbcc5b50c1b04e8fc7232c1ed1b16f4d4a60eea2d0b67221e49d0
      - type: file
        path: net.pistegamez.PekkaKana2.desktop
      - type: file
        path: net.pistegamez.PekkaKana2.png
      - type: file
        path: net.pistegamez.PekkaKana2.metainfo.xml
    post-install:
      - cp -a res /app/share/pekka-kana-2
      - install -Dm755 /.bin/pekka-kana-2 /app/share/pekka-kana-2/pekka-kana-2
      - install -Dm644 net.pistegamez.PekkaKana2.desktop /app/share/applications/net.pistegamez.PekkaKana2.desktop
      - install -Dm644 net.pistegamez.PekkaKana2.png /app/share/icons/hicolor/128x128/apps/net.pistegamez.PekkaKana2.png
      - install -Dm644 net.pistegamez.PekkaKana2.metainfo.xml /app/share/metainfo/net.pistegamez.PekkaKana2.metainfo.xml
